[project]
name = "salesagg"
version = "0.1.0"
description = "starter for daily sales aggregator tutorial"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.21",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
salesagg = "salesagg.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesagg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
